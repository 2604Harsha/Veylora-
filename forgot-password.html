
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Veylora</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <a class="brand auth-brand" href="index.html"><span class="brand-icon">V</span> Veylora</a>

  <main class="auth-container">
    <section class="auth-card">
      <div class="auth-heading">
        <div class="mini-icon">⌑</div>
        <span class="eyebrow">ACCOUNT RECOVERY</span>
        <h1>Forgot password?</h1>
        <p>Enter your registered email address to continue.</p>
      </div>

      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
          <small class="field-error" id="emailError"></small>
        </div>
        <div id="forgotMessage" class="message" role="status"></div>
        <button type="submit" class="btn btn-full">Continue <span>→</span></button>
      </form>

      <p class="auth-switch"><a href="login.html">← Back to login</a></p>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
