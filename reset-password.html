
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Veylora</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <a class="brand auth-brand" href="index.html"><span class="brand-icon">V</span> Veylora</a>

  <main class="auth-container">
    <section class="auth-card">
      <div class="auth-heading">
        <div class="mini-icon">✧</div>
        <span class="eyebrow">NEW CREDENTIALS</span>
        <h1>Reset password</h1>
        <p>Create a new password for your Veylora account.</p>
      </div>

      <form id="resetForm" novalidate>
        <div class="form-group">
          <label for="password">New password</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="Minimum 6 characters" autocomplete="new-password" required>
            <button type="button" class="password-toggle" data-toggle="password">Show</button>
          </div>
          <small class="field-error" id="passwordError"></small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm new password</label>
          <div class="password-wrap">
            <input type="password" id="confirmPassword" placeholder="Re-enter new password" autocomplete="new-password" required>
            <button type="button" class="password-toggle" data-toggle="confirmPassword">Show</button>
          </div>
          <small class="field-error" id="confirmPasswordError"></small>
        </div>

        <div id="resetMessage" class="message" role="status"></div>
        <button type="submit" class="btn btn-full">Update Password <span>→</span></button>
      </form>

      <p class="auth-switch"><a href="login.html">← Back to login</a></p>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
