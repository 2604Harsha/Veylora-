
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Veylora</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <a class="brand auth-brand" href="index.html"><span class="brand-icon">V</span> Veylora</a>

  <main class="auth-container">
    <section class="auth-card">
      <div class="auth-heading">
        <div class="mini-icon">◈</div>
        <span class="eyebrow">WELCOME BACK</span>
        <h1>Sign in to Veylora</h1>
        <p>Enter your credentials to access your account.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
          <small class="field-error" id="emailError"></small>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">Password</label>
            <a href="forgot-password.html">Forgot password?</a>
          </div>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="password-toggle" id="togglePassword" aria-label="show password">Show</button>
          </div>
          <small class="field-error" id="passwordError"></small>
        </div>

        <div id="loginMessage" class="message" role="status"></div>
        <button type="submit" class="btn btn-full">Sign In <span>→</span></button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Create account</a></p>
    </section>
    <p class="auth-caption">Your Identity. Your Access. Your Space.</p>
  </main>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
